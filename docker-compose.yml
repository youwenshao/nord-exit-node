# NordVPN (Linux) + Tailscale exit node
# Internet egress for clients that select this exit node goes through Nord.
# Mesh traffic stays on Tailscale (100.64.0.0/10 is allowlisted through Nord's kill switch).
services:
  vpn:
    image: ghcr.io/bubuntux/nordvpn:latest
    container_name: nord-exit-vpn
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    extra_hosts:
      - "login.tailscale.com:192.200.0.104"
      - "login.tailscale.com:192.200.0.108"
      - "login.tailscale.com:192.200.0.101"
      - "controlplane.tailscale.com:192.200.0.111"
      - "controlplane.tailscale.com:192.200.0.108"
      - "controlplane.tailscale.com:192.200.0.109"
    environment:
      - TOKEN=${TOKEN}
      - CONNECT=${CONNECT:-Hong_Kong}
      - TECHNOLOGY=${TECHNOLOGY:-NordLynx}
      - NETWORK=${NETWORK:-100.64.0.0/10}
      - TZ=${TZ:-Asia/Hong_Kong}
    volumes:
      - ./scripts/nord-connect-svc:/etc/services.d/nord-connect:ro
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nordvpn status | grep -q 'Status: Connected'"]
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 60s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: nord-exit-tailscale
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
    env_file:
      - .env.tailscale
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    volumes:
      - ./state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
